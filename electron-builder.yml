appId: com.albert.habit-grid
productName: Habit Grid
artifactName: ${name}-${version}-${os}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
mac:
  category: public.app-category.productivity
  identity: null
  icon: build/icon.png
  target:
    - target: dir
      arch:
        - arm64
        - x64
win:
  icon: build/icon.ico
  target:
    - target: portable
      arch:
        - x64
portable:
  artifactName: ${name}-${version}-win-${arch}.${ext}
npmRebuild: false
